<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <meta
      name="description"
      content="Kontakt multimediedesigner Ludwig Elhauge."
    >

    <title>Kontakt · Ludwig Elhauge</title>

    <!-- Din normale styling til header og footer -->
    <link rel="stylesheet" href="style.css">

    <!-- Styling kun til kontaktsiden -->
    <link rel="stylesheet" href="kontakt.css">

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    >

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    >

    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
  </head>

  <body>
    <header class="site-header">
      <a
        class="brand"
        href="index.html"
        aria-label="Gå til forsiden"
      >
        <img
          src="Img/logo.png"
          alt="Ludwig Elhauge logo"
        >
      </a>

      <nav
        class="site-nav"
        aria-label="Primær navigation"
      >
        <a href="index.html">Forside</a>
        <a href="om-mig.html">Om mig</a>
        <a href="kontakt.html">Kontakt</a>
      </nav>
    </header>

    <main class="clean-contact-page">
      <section class="clean-contact">
        <div class="clean-contact-inner">

          <div class="clean-contact-copy">
            <p class="clean-contact-kicker">
              Kontakt
            </p>

            <h1>
              Lad os tage<br>
              en snak.
            </h1>

            <div class="clean-contact-details">
              <a href="mailto:lv.elhauge@gmail.com">
                <span>Email</span>

                <strong>
                  lv.elhauge@gmail.com
                </strong>

                <i aria-hidden="true">↗</i>
              </a>

              <a href="tel:+4542439890">
                <span>Telefon</span>

                <strong>
                  42 43 98 90
                </strong>

                <i aria-hidden="true">↗</i>
              </a>
            </div>
          </div>

          <div class="clean-contact-image">
            <img
              src="Img/ludwigstol.png"
              alt="Ludwig Elhauge siddende i en stol"
            >
          </div>

        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <div class="footer-meta">
          <p class="footer-email">
            lv.elhauge@gmail.com
          </p>

          <a
            class="footer-link"
            href="https://www.linkedin.com/in/ludwig-valentin-dahl-elhauge-713512254/"
            target="_blank"
            rel="noopener"
          >
            LinkedIn
          </a>
        </div>
      </div>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
